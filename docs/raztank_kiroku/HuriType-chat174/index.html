<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>にけのラズタンク進捗(ChatType)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #chatLog {
            max-height: 300px;   /* にけの好きな高さに調整できる */
            overflow-y: auto;    /* 縦スクロール */
        }
    </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="../../index.html">Nyake73</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
            <a class="nav-link" href="#" onclick="openSettings()">名前の変更</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="../index.html" onclick="openSettings()">Page_back</a>
        </li>
      </ul>
    </div>
  </div>
  </nav>
    <div class="card m-3 p-3">
      <h1>進捗チャット</h1>
      <p>☆raztankの進捗を文章のみで簡単にまとめたもの</p>
    </div>
    <div id="chatLog" class="card m-3 p-3"></div>
    <div id="userSetup" class="card m-3 p-3">
        <input id="userName" class="form-control mb-2" placeholder="name">
        <input id="adminPass" class="form-control mb-2" type="password" placeholder="pass（任意）">
        <button class="btn btn-outline-warning" onclick="saveUser()">Ok</button>
    </div>
    <div class="card m-3 p-3" style="position: sticky; bottom: 0; z-index: 10;">
        <textarea id="chatInput" class="form-control" rows="3" placeholder="進捗(KPT)"></textarea>
        <button class="btn btn-outline-primary mt-2" onclick="postChat()">投稿</button>
    </div>

<script>
const ADMIN_PASSWORD ="nyanrhif375"; // にけが決める管理者パスワード

window.onload = () => {
  loadChats();

  const savedName = localStorage.getItem("userName");
  if (savedName) {
    document.getElementById("userSetup").style.display = "none";
  }
};

function saveUser() {
  const nameInput = document.getElementById("userName");
  const passInput = document.getElementById("adminPass");

  if (nameInput.value.trim() === "") {
    alert("name");
    return;
  }

  localStorage.setItem("userName", nameInput.value);
  localStorage.setItem("adminAuth", passInput.value === ADMIN_PASSWORD);

  document.getElementById("userSetup").style.display = "none";
}

function postChat() {
  const input = document.getElementById("chatInput");
  if (input.value.trim() === "") return;

  const name = localStorage.getItem("userName");
  const isAdmin = localStorage.getItem("adminAuth") === "true";

  fetch("YOUR_GOOGLE_APPS_SCRIPT_URL", {
    method: "POST",
    body: JSON.stringify({
      name: name,
      text: input.value,
      admin: isAdmin
    })
  }).then(() => {
    input.value = "";
    loadChats();
  });
}
    
function loadChats() {
  const log = document.getElementById("chatLog");
  log.innerHTML = "";

  fetch("YOUR_GOOGLE_APPS_SCRIPT_URL")
    .then(res => res.json())
    .then(data => {
      data.forEach((row) => {
        const [name, text, admin] = row;
        const adminMark = admin === "true" ? "🐾" : "#";

        const post = document.createElement("div");
        post.className = "alert alert-secondary mt-2";
        post.innerHTML = `
          <strong>${adminMark} ${name}</strong><br>
          <span>${text}</span>
        `;
        log.appendChild(post);
      });
    });
}

function deleteChat(index) {
  const chats = JSON.parse(localStorage.getItem("raztankChats") || "[]");
  chats.splice(index, 1);
  localStorage.setItem("raztankChats", JSON.stringify(chats));
  loadChats();
}

function editChat(index) {
  const chats = JSON.parse(localStorage.getItem("raztankChats") || "[]");
  const newText = prompt("編集内容を入力", chats[index].text);

  if (newText !== null) {
    chats[index].text = newText;
    localStorage.setItem("raztankChats", JSON.stringify(chats));
    loadChats();
  }
}
function openSettings() {
  document.getElementById("userSetup").style.display = "block";
}

function resetUser() {
  localStorage.removeItem("userName");
  localStorage.removeItem("adminAuth");
  document.getElementById("userSetup").style.display = "block";
}
</script>
</script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
