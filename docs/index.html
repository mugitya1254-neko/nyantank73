  <script>
const PAGE_PASSWORD = "Jusk83T64abulQE";

window.onload = () => {
  if (localStorage.getItem("pageUnlocked") === "true") {
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("pageContent").style.display = "block";
  }
};

function unlockPage() {
  const input = document.getElementById("pagePass").value;

  if (input === PAGE_PASSWORD) {
    // 認証済みを保存
    localStorage.setItem("pageUnlocked", "true");

    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("pageContent").style.display = "block";
  } else {
    alert("パスワードが違います");
  }
}
  </script>
  <script>
function logout() {
  localStorage.removeItem("pageUnlocked");
  location.reload(); // ページをリロードしてロック画面に戻す
}
  </script>
